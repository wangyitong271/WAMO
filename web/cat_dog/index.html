<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>猫狗识别</title>
    <script src="cat_dog.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }

        h1 {
            color: #5a5a5a;
        }

        #imagePreview,
        canvas {
            max-width: 100px;
            margin: 10px;
            border: 1px solid #ccc;
            padding: 5px;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            margin: 10px;
            font-size: 18px;
        }

        .box {
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>


    <div class="box">
        <!-- <a href="../index.html">返回</a> -->

        <h1>猫狗识别</h1>
        <input type="file" id="imageInput" accept="image/*">
        <br>
        <img id="imagePreview" src="" alt="Image preview...">
        <p id="predictionResult"></p>
        <p>耗时: <span id="timeCost"></span> ms</p>
        <p>内存占用： <span id="memoryUsage"></span> mb</p>
        <canvas style="display:none;"></canvas>
    </div>


    <script>
        var Module = {

            onRuntimeInitialized: function () {
                document.getElementById('imageInput').addEventListener('change', handleImage, false);
            }
        };

        function handleImage(event) {
            var reader = new FileReader();
            reader.onload = function (event) {
                var img = new Image();
                document.getElementById('imagePreview').src = event.target.result;
                img.onload = function () {
                    var canvas = document.createElement('canvas');
                    var ctx = canvas.getContext('2d');
                    canvas.width = 200;
                    canvas.height = 200;
                    ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, 200, 200);
                    var imageData = ctx.getImageData(0, 0, 200, 200);
                    predict(imageData);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function predict(imageData) {
            var time_start = new Date().getTime();

            var data = Module['createIamge'](200, 200, 3);
            for (var i = 0; i < 200; i++) {
                for (var j = 0; j < 200; j++) {
                    var idx = (i * 200 + j) * 4;
                    for (var k = 0; k < 3; k++) {
                        Module['setIamgeData'](data, i, j, k, imageData.data[idx + k] / 255.0);
                    }
                }
            }
            var result = Module['predict'](data);
            if (result == 0) {
                result = '猫';
            } else {
                result = '狗';
            }

            var time_end = new Date().getTime();
            var memory_used = performance.memory.usedJSHeapSize; // 结束后内存使用
            
            document.getElementById('predictionResult').innerHTML = '预测结果: ' + result;
            document.getElementById('timeCost').innerHTML = time_end - time_start;
            var memory_used = memory_used / 1024 / 1024;
            // 保留2位小数
            document.getElementById('memoryUsage').innerHTML = memory_used.toFixed(2);
            Module['freeImage'](data);
        }
    </script>
</body>

</html>
