<script>
    // 用于存储内存分析结果的全局变量
    var memoryAnalysisResults = {
        beforeState: null,
        afterState: null,
        changedAddresses: null
    };
    
    var Module = {
        // 记录内存对象
        memoryBase: 0,
        memory: null,
        
        // 初始化完成时的回调
        onRuntimeInitialized: function() {
            console.log('Module loaded');
            document.getElementById('predictButton').addEventListener('click', predict);
        },
        
        // 内存增长回调
        onGrowMemory: function(size) {
            console.log("WebAssembly内存增长到: " + size + " 页");
        },
        
        // 模块准备好时
        postRun: function() {
            console.log("WebAssembly模块已加载完成");
            // 此时可以确保可以获取内存
            if(Module.HEAPU8 && Module.HEAPU8.buffer) {
                console.log("成功获取WebAssembly内存，大小：" + (Module.HEAPU8.buffer.byteLength / 1024 / 1024).toFixed(2) + " MB");
            }
        }
    };
    
    // 捕获内存状态函数
    function captureMemoryState() {
        try {
            let memoryBuffer = null;
            
            // 尝试多种方式获取WebAssembly内存
            if (Module.HEAPU8 && Module.HEAPU8.buffer) {
                // 最常见的情况，Emscripten通常使用HEAPU8等类型化数组
                memoryBuffer = Module.HEAPU8.buffer;
                console.log(`通过HEAPU8获取内存成功，大小: ${memoryBuffer.byteLength} bytes`);
            } else if (Module.buffer) {
                // 直接buffer属性
                memoryBuffer = Module.buffer;
            } else if (Module.asm && Module.asm.memory) {
                // WebAssembly.Memory对象
                memoryBuffer = Module.asm.memory.buffer;
            } else if (Module.wasmMemory && Module.wasmMemory.buffer) {
                // 直接wasmMemory对象
                memoryBuffer = Module.wasmMemory.buffer;
            } else if (typeof WebAssembly !== 'undefined' && WebAssembly.Memory && Module.memory instanceof WebAssembly.Memory) {
                memoryBuffer = Module.memory.buffer;
            } else {
                console.error('无法访问WebAssembly内存，请检查控制台输出查看模块结构');
                console.log('Module对象属性:', Object.keys(Module));
                return new Uint8Array();
            }
            
            if (!memoryBuffer) {
                console.error('无法获取有效的内存缓冲区');
                return new Uint8Array();
            }
            
            // 创建内存快照（使用Uint8Array复制整个内存）
            // 注意：使用slice(0)复制整个内存区域，避免引用原始缓冲区
            const memorySnapshot = new Uint8Array(memoryBuffer.slice(0));
            
            console.log(`内存快照捕获成功: ${memorySnapshot.length} bytes`);
            return memorySnapshot;
        } catch (err) {
            console.error('捕获内存状态失败:', err, err.stack);
            return new Uint8Array();
        }
    }
    
    // 分析内存变化函数
    function analyzeMemoryChanges(before, after) {
        try {
            // 检查内存快照是否捕获成功
            if (!before || !after) {
                console.error('缺少完整的内存状态数据');
                return { 
                    changedAddresses: [],
                    stats: {
                        addressCount: 0,
                        minAddress: 0,
                        maxAddress: 0,
                        memorySpan: 0,
                        uniqueAddresses: 0,
                        utilization: 0
                    }
                };
            }
            
            const length = Math.min(before.length, after.length);
            console.log(`内存分析: 执行前 ${before.length} bytes, 执行后 ${after.length} bytes`);
            
            // 寻找变化的地址
            const changedAddresses = [];
            let minAddress = Number.MAX_SAFE_INTEGER;
            let maxAddress = 0;
            
            // 使用Set收集唯一的变化地址，更高效且自动去重
            const uniqueAddresses = new Set();
            
            // 为了提高性能，限制处理量，每10个字节采样一个
            // 这对于大型内存是必要的，可以根据实际情况调整采样率
            const samplingRate = length > 10000000 ? 10 : 1;
            
            for (let i = 0; i < length; i += samplingRate) {
                if (before[i] !== after[i]) {
                    // 为了避免内存爆炸，只存储有限数量的变化地址
                    if (changedAddresses.length < 10000) {
                        changedAddresses.push(i);
                    }
                    // 将变化的地址添加到唯一地址集合
                    uniqueAddresses.add(i);
                    
                    if (i < minAddress) minAddress = i;
                    if (i > maxAddress) maxAddress = i;
                }
            }
            
            const addressCount = uniqueAddresses.size;
            const memorySpan = addressCount > 0 ? (maxAddress - minAddress + 1) : 0;
            const utilization = memorySpan > 0 ? (addressCount / memorySpan) : 0;
            
            console.log(`内存分析完成:`);
            console.log(`- 变化地址数: ${addressCount} (采样率 ${samplingRate})`);
            console.log(`- 内存访问地址跨度: ${memorySpan} bytes`);
            console.log(`- 内存访问地址范围: ${minAddress} - ${maxAddress}`);
            console.log(`- 唯一内存地址访问数量: ${addressCount}`);
            console.log(`- 内存利用率: ${(utilization * 100).toFixed(2)}%`);
            
            return {
                changedAddresses,
                stats: {
                    addressCount,
                    minAddress: minAddress === Number.MAX_SAFE_INTEGER ? 0 : minAddress,
                    maxAddress,
                    memorySpan,
                    uniqueAddresses: addressCount,
                    utilization
                }
            };
        } catch (err) {
            console.error('分析内存变化失败:', err);
            return { 
                changedAddresses: [],
                stats: {
                    addressCount: 0,
                    minAddress: 0,
                    maxAddress: 0,
                    memorySpan: 0,
                    uniqueAddresses: 0,
                    utilization: 0
                }
            };
        }
    }
    
    // 分析内存分布熵函数
    function analyzeMemoryDistribution(changedAddresses, memorySize) {
        if (!changedAddresses || changedAddresses.length === 0) {
            console.log('没有检测到内存地址变化，熵值为0');
            return { entropy: 0, normalizedEntropy: 0 };
        }
        
        console.log('\n=== 内存分布熵计算详细步骤 ===');
        console.log('1. 初始参数:');
        console.log(`- 变化地址总数: ${changedAddresses.length}`);
        console.log(`- 总内存大小: ${memorySize} bytes`);
        
        // 计算唯一的内存访问地址数量
        const uniqueAddresses = new Set(changedAddresses);
        const uniqueAddressCount = uniqueAddresses.size;
        console.log(`- 唯一内存访问地址数量: ${uniqueAddressCount}`);
        
        // 将内存空间划分为多个桶(bin)
        // 使用唯一访问地址数量作为分区数量，这样可以更好地反映实际的内存访问模式
        // 但为了避免分区过多或过少，我们设置一个合理的范围
        const minBins = 16;  // 最少分区数
        const maxBins = 1024;  // 最多分区数
        const binCount = Math.min(maxBins, Math.max(minBins, uniqueAddressCount));
        const binSize = Math.ceil(memorySize / binCount);
        
        console.log('\n2. 内存分区设置:');
        console.log(`- 分区(bin)数量: ${binCount} (基于唯一访问地址数量)`);
        console.log(`- 每个分区大小: ${binSize} bytes`);
        console.log(`- 分区数量选择说明: min(${maxBins}, max(${minBins}, ${uniqueAddressCount}))`);
        
        const bins = new Array(binCount).fill(0);
        
        // 统计每个桶中的地址数量
        console.log('\n3. 统计每个分区中的地址数量:');
        changedAddresses.forEach(address => {
            const binIndex = Math.floor(address / binSize);
            if (binIndex < binCount) {
                bins[binIndex]++;
            }
        });
        
        // 打印非空分区的统计信息
        console.log('分区统计结果:');
        bins.forEach((count, index) => {
            if (count > 0) {
                console.log(`- 分区 ${index}: ${count} 个地址`);
            }
        });
        
        // 计算熵值
        let entropy = 0;
        const totalAddresses = changedAddresses.length;
        
        console.log('\n4. 计算熵值:');
        console.log('使用公式: H = -Σ(p_i * log2(p_i))');
        
        bins.forEach((count, index) => {
            if (count > 0) {
                const probability = count / totalAddresses;
                const contribution = -probability * Math.log2(probability);
                entropy += contribution;
                
                console.log(`- 分区 ${index}:`);
                console.log(`  概率(p_i) = ${count}/${totalAddresses} = ${probability.toFixed(4)}`);
                console.log(`  -p_i * log2(p_i) = ${contribution.toFixed(4)}`);
            }
        });
        
        console.log(`\n5. 最终熵值: ${entropy.toFixed(4)}`);
        
        // 计算归一化熵值 (0-1范围)
        // 使用实际的分区数量计算最大熵
        const maxEntropy = Math.log2(binCount);
        const normalizedEntropy = maxEntropy > 0 ? entropy / maxEntropy : 0;
        
        console.log('\n6. 归一化计算:');
        console.log(`- 理论最大熵 = log2(实际分区数) = log2(${binCount}) = ${maxEntropy.toFixed(4)}`);
        console.log(`  说明：最大熵出现在所有分区被均匀访问的情况`);
        console.log(`- 归一化熵 = 熵值/最大熵 = ${entropy.toFixed(4)}/${maxEntropy.toFixed(4)} = ${normalizedEntropy.toFixed(4)}`);
        
        // 分析结论
        console.log('\n7. 分布特征分析:');
        let conclusion = '';
        if (normalizedEntropy > 0.8) {
            conclusion = '高度随机分布 (内存地址高度分散，权重可能已被混淆)';
        } else if (normalizedEntropy > 0.5) {
            conclusion = '中度随机分布 (内存地址有一定规律但仍较分散)';
        } else if (normalizedEntropy > 0.3) {
            conclusion = '低度随机分布 (内存地址分布有规律性)';
        } else {
            conclusion = '高度规律分布 (内存地址集中，几乎没有混淆)';
        }
        console.log(`结论: ${conclusion}`);
        console.log('================================\n');
        
        return { entropy, normalizedEntropy };
    }
    
    // 分析地址分布模式函数
    function analyzeAddressDistribution(changedAddresses) {
        if (!changedAddresses || changedAddresses.length <= 1) {
            return {
                avgGap: 0,
                medianGap: 0,
                contiguousRegions: 0,
                maxContiguousBlock: 0
            };
        }
        
        // 对地址排序
        const sortedAddresses = [...changedAddresses].sort((a, b) => a - b);
        
        // 计算地址间隔
        const gaps = [];
        let contiguousRegions = 1;
        let currentBlockSize = 1;
        let maxBlockSize = 1;
        
        for (let i = 1; i < sortedAddresses.length; i++) {
            const gap = sortedAddresses[i] - sortedAddresses[i-1];
            gaps.push(gap);
            
            // 检查连续性
            if (gap === 1) {
                currentBlockSize++;
            } else {
                if (currentBlockSize > maxBlockSize) {
                    maxBlockSize = currentBlockSize;
                }
                currentBlockSize = 1;
                contiguousRegions++;
            }
        }
        
        // 确保最后一个区块也被计算
        if (currentBlockSize > maxBlockSize) {
            maxBlockSize = currentBlockSize;
        }
        
        // 计算统计值
        const avgGap = gaps.reduce((sum, gap) => sum + gap, 0) / gaps.length;
        
        // 计算中位数间隔
        const sortedGaps = [...gaps].sort((a, b) => a - b);
        const midIndex = Math.floor(sortedGaps.length / 2);
        const medianGap = sortedGaps.length % 2 === 0 
            ? (sortedGaps[midIndex - 1] + sortedGaps[midIndex]) / 2 
            : sortedGaps[midIndex];
        
        console.log(`地址分布分析:`);
        console.log(`- 平均间隔: ${avgGap.toFixed(2)} bytes`);
        console.log(`- 中位数间隔: ${medianGap} bytes`);
        console.log(`- 连续区域数量: ${contiguousRegions}`);
        console.log(`- 最大连续区块: ${maxBlockSize} bytes`);
        
        // 判断分布模式
        if (maxBlockSize > sortedAddresses.length * 0.8) {
            console.log('分布模式: 高度集中 (内存访问连续性很高)');
        } else if (avgGap < 10) {
            console.log('分布模式: 较为集中 (内存访问较为连续)');
        } else if (avgGap > 1000) {
            console.log('分布模式: 高度分散 (内存访问非常随机，可能存在混淆)');
        } else {
            console.log('分布模式: 中度分散 (内存访问有一定随机性)');
        }
        
        return {
            avgGap,
            medianGap,
            contiguousRegions,
            maxContiguousBlock: maxBlockSize
        };
    }
    
    // 更新UI上的分析结果
    function updateAnalysisUI(memoryAnalysis, entropyResults, addressDistribution) {
        document.getElementById('memorySpan').textContent = memoryAnalysis.stats.memorySpan.toLocaleString() + ' 字节';
        document.getElementById('memoryRange').textContent = 
            memoryAnalysis.stats.minAddress.toLocaleString() + ' - ' + memoryAnalysis.stats.maxAddress.toLocaleString();
        document.getElementById('uniqueAddresses').textContent = memoryAnalysis.stats.uniqueAddresses.toLocaleString();
        document.getElementById('memoryUtilization').textContent = 
            (memoryAnalysis.stats.utilization * 100).toFixed(2) + '%';
        
        document.getElementById('entropyValue').textContent = 
            entropyResults.normalizedEntropy.toFixed(4);
        document.getElementById('avgGap').textContent = 
            addressDistribution.avgGap.toFixed(2);
        document.getElementById('contiguousRegions').textContent = 
            addressDistribution.contiguousRegions.toLocaleString();
        document.getElementById('maxBlock').textContent = 
            addressDistribution.maxContiguousBlock + ' 字节';
    }

    // 预测函数
    function predict() {
        try {
            // 捕获推理前内存状态
            memoryAnalysisResults.beforeState = captureMemoryState();
            
            var Matrix3DX = Module['createMatrix3D'](1, 7, 6); // 假设有7行6列的数据
            var table = document.getElementsByTagName('table')[0];
            var rows = table.getElementsByTagName('tr');
            for (var i = 1; i < rows.length; i++) {  // 从1开始以跳过表头
                var cells = rows[i].getElementsByTagName('td');
                for (var j = 1; j < cells.length; j++) {
                    var input = cells[j].getElementsByTagName('input')[0];
                    var value = parseFloat(input.value); // 获取input元素的值，并转换为浮点数

                    Module['setMatrix3DData'](Matrix3DX, 0, i - 1, j - 1, value); // 注意j不再需要减1，因为全部td都含input
                }
            }

            var time_start = new Date().getTime();
            var output = Module['predict'](Matrix3DX);
            var time_end = new Date().getTime();
            
            // 捕获推理后内存状态
            memoryAnalysisResults.afterState = captureMemoryState();
            
            // 获取内存使用情况
            var mem_used = 0;
            try {
                if (window.performance && performance.memory) {
                    mem_used = performance.memory.usedJSHeapSize / 1024 / 1024;
                }
            } catch (e) {
                console.warn('无法获取内存使用信息:', e);
            }
            
            document.getElementById('timeCost').textContent = time_end - time_start;
            document.getElementById('memoryCost').textContent = mem_used.toFixed(2);

            var result = Module['getVectorData'](output, 0);
            console.log('predict result: ' + result);
            document.getElementById('result').textContent = result;
            
            // 分析内存变化
            const memoryAnalysis = analyzeMemoryChanges(
                memoryAnalysisResults.beforeState, 
                memoryAnalysisResults.afterState
            );
            memoryAnalysisResults.changedAddresses = memoryAnalysis.changedAddresses;
            
            // 进行内存分布熵分析
            const memorySize = memoryAnalysisResults.afterState.length;
            const entropyResults = analyzeMemoryDistribution(
                memoryAnalysisResults.changedAddresses, 
                memorySize
            );
            
            // 进行地址分布模式分析
            const addressDistribution = analyzeAddressDistribution(
                memoryAnalysisResults.changedAddresses
            );
            
            // 更新UI显示分析结果
            updateAnalysisUI(memoryAnalysis, entropyResults, addressDistribution);
        } catch (error) {
            console.error('预测过程出错:', error);
            document.getElementById('result').textContent = '预测失败: ' + error.message;
        }
    }
</script>
